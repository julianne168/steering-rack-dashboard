(()=>{const skills=[{"id":"a-a-alert-detail-merge","module":"a","label":"本周经营预警检查","title":"模块 A 最终预警明细合并","purpose":"将预警 ASIN 与活动清单、9 项广告指标和环比合并为最终明细。","markdown":"---\r\nname: xbm-steering-a-alert-detail-merge\r\ndescription: 将预警 ASIN 与活动清单、9 项广告指标和环比合并为最终明细。 适用于模块 A 周环比监控表和广告活动数据已生成。\r\n---\r\n\r\n# 模块 A 最终预警明细合并\r\n\r\n## 目的\r\n\r\n将预警 ASIN 与活动清单、9 项广告指标和环比合并为最终明细。\r\n\r\n## 何时使用\r\n\r\n模块 A 周环比监控表和广告活动数据已生成。\r\n\r\n## 执行脚本\r\n\r\n运行本子技能随包附带的脚本：`scripts/模块A_最终预警明细合并.py`。原始主力脚本来源：`02_脚本/当前主力/02_处理分析/模块A_最终预警明细合并.py`。\r\n\r\n## 输入与输出\r\n\r\n- 输入：遵循原脚本从 `03_原数据`、授权数据源或上游模块结果读取。\r\n- 输出：`模块 A 最终预警明细表`，写入资料包约定的 `03_原数据` 或 `04_分析结果`。\r\n\r\n## 使用约束\r\n\r\n- 先检查上游数据是否齐备；拉取类脚本需要相应数据源凭据和权限。\r\n- 不修改 `.env`，不在代码或结果中写入凭据。\r\n- 本脚本只生成数据或分析结果；广告投放、否词、价格和 GitHub 更新需要单独授权。\r\n\r\n\r\n## 执行步骤\r\n\r\n1. 确定当前项目根目录；其中的 `03_原数据/` 为输入数据目录，`04_分析结果/` 为结果目录。\r\n2. 通过工作区启动器运行：`python scripts/run.py --workspace-root <项目根目录> -- <该脚本原有参数>`。\r\n3. 若原脚本支持 `--output` 或 `--output-dir`，传入项目内的绝对路径；否则脚本会使用上述两个标准目录。","fileCount":3,"archive":"module-a-weekly-monitor--a-alert-detail-merge.zip","packageUrl":"subskills/module-a-weekly-monitor--a-alert-detail-merge.zip"},{"id":"a-a-finance-pull","module":"a","label":"本周经营预警检查","title":"模块 A 财务原数据拉取","purpose":"拉取模块 A 所需 VC1 财务销量、销售额和 TACOS 底层数据。","markdown":"---\r\nname: xbm-steering-a-finance-pull\r\ndescription: 拉取模块 A 所需 VC1 财务销量、销售额和 TACOS 底层数据。 适用于模块 A 周环比分析所需原数据。\r\n---\r\n\r\n# 模块 A 财务原数据拉取\r\n\r\n## 目的\r\n\r\n拉取模块 A 所需 VC1 财务销量、销售额和 TACOS 底层数据。\r\n\r\n## 何时使用\r\n\r\n模块 A 周环比分析所需原数据。\r\n\r\n## 执行脚本\r\n\r\n运行本子技能随包附带的脚本：`scripts/模块A_Finance原数据拉取.py`。原始主力脚本来源：`02_脚本/当前主力/01_拉取数据/模块A_Finance原数据拉取.py`。\r\n\r\n## 输入与输出\r\n\r\n- 输入：遵循原脚本从 `03_原数据`、授权数据源或上游模块结果读取。\r\n- 输出：`模块 A 财务原数据`，写入资料包约定的 `03_原数据` 或 `04_分析结果`。\r\n\r\n## 使用约束\r\n\r\n- 先检查上游数据是否齐备；拉取类脚本需要相应数据源凭据和权限。\r\n- 不修改 `.env`，不在代码或结果中写入凭据。\r\n- 本脚本只生成数据或分析结果；广告投放、否词、价格和 GitHub 更新需要单独授权。\r\n\r\n\r\n## 执行步骤\r\n\r\n1. 确定当前项目根目录；其中的 `03_原数据/` 为输入数据目录，`04_分析结果/` 为结果目录。\r\n2. 通过工作区启动器运行：`python scr
