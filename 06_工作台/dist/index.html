        </div>
      </article>

      <article class="panel health-panel">
        <div class="panel-head"><div><p class="eyebrow">工作台闭环</p><h2>处理状态</h2></div><span class="mini-badge">每周一刷新</span></div>

      </article>

        </div>
      </div>

          <tr data-priority="P0"><td><span class="priority-number p0">P0</span></td><td><strong>B0CD241Q7W</strong><small>模块 B</small></td><td>购物车丢失</td><td>SMC：无购物车或购物车异常</td><td>排查 Buy Box 资格、价格与配送</td><td>冻结增投</td><td><span class="status waiting">待确认</span></td></tr>

          <tr data-priority="P1"><td><span class="priority-number p1">P1</span></td><td><strong>power steering rack…</strong><small>B0GGRPCTLZ</small></td><td>候选否词</td><td>不相关品牌；近 7 天 0 订单</td><td>等待模块 E 校验</td><td>无需</td><td><span class="status review">待校验</span></td></tr>
